workflows:
  ios-release:
    name: iOS Build (Unsigned .ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: 'ios/SuperMarketApp.xcworkspace'
        XCODE_SCHEME: 'SuperMarketApp'
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo Prebuild (Generate native iOS project)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build unsigned IPA
        script: |
          set -e
          set -o pipefail

          mkdir -p /tmp/xcodebuild_logs
          mkdir -p build/ios/xcarchive
          mkdir -p build/ios/ipa

          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/ios/xcarchive/$XCODE_SCHEME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xcodebuild_logs/xcodebuild.log

          # Package .app bundle into unsigned .ipa
          rm -rf Payload
          mkdir Payload
          cp -R "build/ios/xcarchive/$XCODE_SCHEME.xcarchive/Products/Applications/"*.app Payload/
          zip -r -y "build/ios/ipa/$XCODE_SCHEME.ipa" Payload
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
